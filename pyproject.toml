[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-bench-oj"
version = "0.2.0"
description = "CAE data protocol, structural validation and tolerance-based grading"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "numpy>=2.0,<3", "gmsh==4.15.2"]

[project.optional-dependencies]
heat = ["scipy>=1.17,<2"]
pdebench = ["h5py>=3.13,<4", "requests>=2.32,<3", "PyYAML>=6,<7", "scipy>=1.17,<2"]

[project.scripts]
caeoj = "caeoj.cli:main"

[tool.setuptools]
packages = ["caeoj"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
caeoj = ["problem.schema.json"]
