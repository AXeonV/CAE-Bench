[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cae-bench-oj"
version = "0.3.0"
description = "CAE data protocol, structural validation and tolerance-based grading"
requires-python = ">=3.11"
dependencies = ["jsonschema==4.26.0", "numpy>=2.0,<3", "gmsh==4.15.2", "h5py>=3.13,<4"]

[project.optional-dependencies]
maint = ["packaging>=25,<27", "huggingface_hub>=1.0,<2"]
heat = ["scipy>=1.17,<2"]
pdebench = ["requests>=2.32,<3", "PyYAML>=6,<7"]

[project.scripts]
caeoj = "caeoj.cli:main"
caeoj-maint = "caeoj_tools.cli:main"

[tool.setuptools]
packages = ["caeoj", "caeoj_tools"]

[tool.setuptools.package-dir]
"" = "src"

[tool.setuptools.package-data]
caeoj = ["problem.schema.json", "grading.schema.json", "case-grading.schema.json", "public-runtime.json"]
