schema_version = "1.3"
artifacts = ["/app/submission"]

[agent]
timeout_sec = 1800.0

[environment]
build_timeout_sec = 1200.0
cpus = 2
memory_mb = 2048
workdir = "/app"

[verifier]
timeout_sec = 1200.0
environment_mode = "separate"
# The verifier's Docker Compose definition enforces network_mode: none.
